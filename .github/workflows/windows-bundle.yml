# Bundle Windows: build NATIVO no Windows + teste automatizado do zip.
# Linha do bundle = release/* (hoje release/1.3; nunca main).
#
#  - push/PR em release/**  -> checks + build (zip E RefereeLights.exe) +
#                               testes do zip + testes do exe + soak de
#                               média duração com todas as telas
#                               (artefatos ficam 14 dias)
#  - workflow_dispatch       -> idem; com publish_teste=true atualiza o
#                               pre-release ROLANTE `teste` (sem versão nova).
#  - workflow_dispatch com release_version=X.Y.Z -> build no canal "stable",
#                               TODOS os testes e, passando, a tag vX.Y.Z vira
#                               a Latest (exe + zip + manifesto estável
#                               assinado). Só depois do teste manual aprovar o
#                               build "teste" do mesmo commit.
name: windows-bundle

on:
  push:
    branches: ['release/**']
    paths: ['server/**', 'frontend/**', 'tools/windows/**', '.github/workflows/windows-bundle.yml']
  pull_request:
    branches: ['release/**']
  workflow_dispatch:
    inputs:
      publish_teste:
        description: 'Publicar zip + exe testados no pre-release rolante "teste"'
        type: boolean
        default: false
      release_version:
        description: 'Versão estável a publicar como Latest (ex.: 1.4.0). Vazio = build de teste.'
        type: string
        default: ''
      release_notes_pt:
        description: 'Novidades (pt) para a release e o aviso de atualização'
        type: string
        default: ''
      soak_minutes:
        description: 'Duração do soak (minutos)'
        type: string
        default: '25'

permissions:
  contents: read

concurrency:
  group: windows-bundle-${{ github.ref }}
  cancel-in-progress: true

env:
  # CI nunca fala com serviços de produção
  TELEMETRY_ENABLED: 'false'

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Server — typecheck, lint, checagens
        working-directory: server
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npx tsx scripts/check-key-relay.ts
          npx tsx scripts/check-client-ip.ts
      - name: Frontend — lint e typecheck
        working-directory: frontend
        run: |
          npm ci
          npx tsc --noEmit
          npm run lint
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/windows/launcher/go.mod
          cache-dependency-path: tools/windows/launcher/go.sum
      - name: Lançador (Go) — testes e vet para Windows
        working-directory: tools/windows/launcher
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; echo "::error::gofmt"; exit 1; }
          go test ./...
          touch payload.tar.zst
          GOOS=windows GOARCH=amd64 go vet ./...

  build:
    needs: checks
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # O Node do BUILD usa a mesma versão do Node embutido no pacote
      # (NODE_VERSION do build-package.mjs).
      - name: Ler NODE_VERSION do build-package.mjs
        id: nodever
        shell: bash
        run: echo "v=$(grep -oP "NODE_VERSION = '\K[0-9.]+" tools/windows/build-package.mjs)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.nodever.outputs.v }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/windows/launcher/go.mod
          cache-dependency-path: tools/windows/launcher/go.sum

      - name: Guard — só release/*
        shell: bash
        run: |
          case "$GITHUB_REF_NAME" in release/*) ;; *)
            # PR: a branch alvo precisa ser release/*
            case "$GITHUB_BASE_REF" in release/*) ;; *) echo "::error::Bundle só sai de release/* (rodado em $GITHUB_REF_NAME)"; exit 1;; esac;;
          esac

      - name: Build do pacote (npm ci + verify-bundle estático/redirect)
        shell: bash
        env:
          # Nenhuma URL de produção pode existir no ambiente do build.
          NEXT_PUBLIC_API_URL: ''
          NEXT_PUBLIC_WS_URL: ''
          BUNDLE_VERIFY_RUNTIME: '0'
          # Canal embutido no exe: "stable" só no build de release
          RL_CHANNEL: ${{ inputs.release_version != '' && 'stable' || 'teste' }}
        run: node tools/windows/build-package.mjs

      - name: Versão do build = versão pedida (release)
        if: inputs.release_version != ''
        shell: bash
        run: |
          got=$(node -p "require('./dist/build-info.json').version")
          [ "$got" = "${{ inputs.release_version }}" ] || { echo "::error::server/package.json está em $got, release pedida ${{ inputs.release_version }}"; exit 1; }

      - name: Lockfiles intactos (build não pode reescrever dependências)
        shell: bash
        run: git diff --exit-code -- server/package-lock.json frontend/package-lock.json

      - uses: actions/upload-artifact@v4
        with:
          name: referee-lights-windows
          path: |
            dist/referee-lights-windows.zip
            dist/RefereeLights.exe
            dist/build-info.json
          retention-days: 14

  test:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      # Pasta com espaço + acento, como "C:\Users\José\Área de Trabalho".
      BUNDLE_DIR: 'C:\Testes Árbitro\Área de Trabalho\Referee Lights'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Playwright (só para os testes; não entra no pacote)
        working-directory: frontend
        shell: pwsh
        run: |
          npm ci --no-audit --no-fund
          npx playwright install chromium

      - uses: actions/download-artifact@v4
        with:
          name: referee-lights-windows
          path: dist

      # Extrai o zip numa pasta com espaço e acento e executa o pacote com o
      # node.exe embutido: todas as telas, fluxo completo, timer/intervalo/
      # idioma/legenda, Key Relay, restart com recuperação (SQLite), fila
      # local com destino offline, CSS inline + tags de sessão,
      # abuso, e logs sem "Cannot find module"/ENOENT.
      - name: verify-bundle (zip extraído + execução completa)
        shell: pwsh
        run: node tools/windows/verify-bundle.mjs

      - name: Extrair como o usuário faria (Expand-Archive + Mark of the Web)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:BUNDLE_DIR | Out-Null
          $t = Measure-Command { Expand-Archive -LiteralPath dist/referee-lights-windows.zip -DestinationPath $env:BUNDLE_DIR -Force }
          $n = (Get-ChildItem -LiteralPath $env:BUNDLE_DIR -Recurse -File).Count
          Write-Host ("Extraído em {0:N1}s, {1} arquivos" -f $t.TotalSeconds, $n)
          # Simula o "Mark of the Web" de um zip baixado do GitHub
          Get-ChildItem -LiteralPath $env:BUNDLE_DIR -Recurse -File | ForEach-Object {
            Set-Content -LiteralPath $_.FullName -Stream Zone.Identifier -Value "[ZoneTransfer]`r`nZoneId=3" }
          # Exercita o desligamento do LEIA-ME (e garante zero tráfego para produção)
          $envFile = Join-Path $env:BUNDLE_DIR 'server\.env'
          (Get-Content -LiteralPath $envFile) -replace '^TELEMETRY_ENABLED=.*','TELEMETRY_ENABLED=false' | Set-Content -LiteralPath $envFile

      - name: Módulo nativo carrega no node.exe embutido (ABI certa)
        shell: pwsh
        run: |
          Push-Location (Join-Path $env:BUNDLE_DIR 'server\dist')
          & ..\..\node\node.exe -e "const m={exports:{}}; process.dlopen(m, require('path').resolve('better_sqlite3.node')); console.log('better_sqlite3 ok, abi', process.versions.modules)"
          if ($LASTEXITCODE -ne 0) { throw 'better_sqlite3.node não carrega no node.exe do pacote' }
          Pop-Location

      - name: Subir como o Iniciar.cmd (headless)
        shell: pwsh
        run: ./tools/windows/ci/headless-launch.ps1 -BundleDir $env:BUNDLE_DIR

      - name: Smoke e2e (fluxo completo) pelo Iniciar.cmd
        shell: pwsh
        run: |
          & (Join-Path $env:BUNDLE_DIR 'node\node.exe') tools/windows/ci/smoke-e2e.cjs (Join-Path $env:BUNDLE_DIR 'frontend') http://127.0.0.1:3000 --full
          if ($LASTEXITCODE -ne 0) { throw 'smoke e2e falhou' }

      - name: Resiliência — payload malformado não derruba o server
        shell: pwsh
        run: |
          & (Join-Path $env:BUNDLE_DIR 'node\node.exe') tools/windows/ci/smoke-e2e.cjs (Join-Path $env:BUNDLE_DIR 'frontend') http://127.0.0.1:3000 --malformed
          if ($LASTEXITCODE -ne 0) { throw 'payload malformado derrubou o server' }

      - name: UI pelo IP da LAN (Chromium) — telas, CSS inline, tags de sessão
        shell: pwsh
        run: |
          $ip = (Get-NetIPAddress -AddressFamily IPv4 | Where-Object { $_.IPAddress -notlike '127.*' -and $_.IPAddress -notlike '169.254.*' } | Select-Object -First 1).IPAddress
          Write-Host "IP da LAN: $ip"
          # O QR do admin precisa apontar para um IP privado da máquina, não localhost
          $html = (Invoke-WebRequest "http://${ip}:3000/admin" -UseBasicParsing).Content
          if ($html -notmatch '"networkIps":\[\s*"') { throw 'admin sem networkIps — QR sairia com localhost' }
          node tools/windows/ci/ui-smoke.mjs "http://${ip}:3000" (Join-Path $env:BUNDLE_DIR 'frontend')
          if ($LASTEXITCODE -ne 0) { throw 'UI smoke falhou' }

      - name: Uma porta só (nada escutando na 3333) e erro de tela aceito
        shell: pwsh
        run: |
          if (Get-NetTCPConnection -State Listen -LocalPort 3333 -ErrorAction SilentlyContinue) { throw 'algo escutando na 3333: o pacote deveria usar só a 3000' }
          $r = Invoke-WebRequest -Method Post -ContentType 'application/json' -Body '{"kind":"TypeError","message":"teste CI","screen":"admin"}' http://127.0.0.1:3000/client-errors -UseBasicParsing
          if ($r.StatusCode -ne 204) { throw "POST /client-errors respondeu $($r.StatusCode)" }

      - name: Recuperação pós-restart via Parar.cmd/Iniciar.cmd (mesma sala volta)
        shell: pwsh
        run: |
          $room = Invoke-RestMethod -Method Post -ContentType 'application/json' -Body '{}' http://127.0.0.1:3000/rooms
          Start-Sleep 2
          & (Join-Path $env:BUNDLE_DIR 'Parar.cmd')
          Start-Sleep 3
          ./tools/windows/ci/headless-launch.ps1 -BundleDir $env:BUNDLE_DIR
          $body = @{ adminPin = $room.adminPin } | ConvertTo-Json
          Invoke-RestMethod -Method Post -ContentType 'application/json' -Body $body "http://127.0.0.1:3000/rooms/$($room.roomId)/access" | Out-Null
          Write-Host "Sala $($room.roomId) recuperada após restart"

      - name: Parar.cmd encerra tudo (portas livres)
        if: always()
        shell: pwsh
        run: |
          & (Join-Path $env:BUNDLE_DIR 'Parar.cmd')
          Start-Sleep 3
          $busy = Get-NetTCPConnection -State Listen -LocalPort 3000,3333 -ErrorAction SilentlyContinue
          if ($busy) { $busy | Format-Table; throw 'Parar.cmd deixou processos escutando' }

      - name: Dados do server em caso de falha
        if: failure()
        shell: pwsh
        run: Get-ChildItem -LiteralPath (Join-Path $env:BUNDLE_DIR 'server\data') -ErrorAction SilentlyContinue

  test-exe:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Playwright (só para os testes)
        working-directory: frontend
        shell: pwsh
        run: |
          npm ci --no-audit --no-fund
          npx playwright install chromium
      - uses: actions/download-artifact@v4
        with:
          name: referee-lights-windows
          path: dist
      - name: Extrair o zip (dados "antigos" para a migração)
        shell: pwsh
        run: Expand-Archive -LiteralPath dist/referee-lights-windows.zip -DestinationPath "$env:RUNNER_TEMP\zip-antigo" -Force
      # Exe em pasta com espaço/acento, LOCALAPPDATA isolado: migração do zip,
      # smoke/segurança/UI na 3000, nenhuma janela de console (inclusive o
      # PowerShell do Key Relay), instância única, node morto → reerguido,
      # canal de erros do lançador, --quit libera a porta e encerra as
      # sessões, Job Object (salas continuam após queda), porta ocupada → 3001.
      - name: RefereeLights.exe — bateria completa
        shell: pwsh
        run: node tools/windows/ci/run-exe-e2e.mjs dist/RefereeLights.exe "$env:RUNNER_TEMP\zip-antigo"

  test-update:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/windows/launcher/go.mod
          cache-dependency-path: tools/windows/launcher/go.sum
      - uses: actions/download-artifact@v4
        with:
          name: referee-lights-windows
          path: dist
      - name: Extrair o zip (conteúdo das versões de teste)
        shell: pwsh
        run: Expand-Archive -LiteralPath dist/referee-lights-windows.zip -DestinationPath "$env:RUNNER_TEMP\pacote" -Force
      # 1.90.0 → 1.91.0 (troca na hora com juiz conectado, sessões encerradas) → 1.92.0
      # quebrada (volta sozinha para a 1.91.0); hash e assinatura adulterados
      # recusados; sem manifesto o início não atrasa.
      - name: Canal de atualização — ponta a ponta
        shell: pwsh
        run: node tools/windows/ci/run-update-e2e.mjs "$env:RUNNER_TEMP\pacote"

  soak:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      SOAK_MINUTES: ${{ inputs.soak_minutes || '25' }}
      LOCALAPPDATA_TEST: 'C:\Soak Árbitro\LocalAppData'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Playwright (só para os testes)
        working-directory: frontend
        shell: pwsh
        run: |
          npm ci --no-audit --no-fund
          npx playwright install chromium
      - uses: actions/download-artifact@v4
        with:
          name: referee-lights-windows
          path: dist
      - name: Subir o RefereeLights.exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:LOCALAPPDATA_TEST | Out-Null
          $env:LOCALAPPDATA = $env:LOCALAPPDATA_TEST
          $env:RL_NO_BROWSER = '1'
          Start-Process -FilePath (Resolve-Path dist/RefereeLights.exe)
          $deadline = (Get-Date).AddSeconds(90)
          while ((Get-Date) -lt $deadline) {
            try { if ((Invoke-WebRequest http://127.0.0.1:3000/admin -UseBasicParsing -TimeoutSec 3).StatusCode -eq 200) { break } } catch { Start-Sleep 1 }
          }
          Invoke-WebRequest http://127.0.0.1:3000/health -UseBasicParsing | Out-Null
      # Todas as telas num Chromium real pelo IP da LAN, decisões com cliques
      # dos árbitros, timer/intervalo/legenda/idioma, node derrubado no meio
      # (o lançador reergue), F5 em telas, memória do node e das telas.
      - name: Soak (${{ env.SOAK_MINUTES }} min)
        shell: pwsh
        run: |
          $ip = (Get-NetIPAddress -AddressFamily IPv4 | Where-Object { $_.IPAddress -notlike '127.*' -and $_.IPAddress -notlike '169.254.*' } | Select-Object -First 1).IPAddress
          $app = Get-ChildItem -Directory (Join-Path $env:LOCALAPPDATA_TEST 'RefereeLights\app') | Select-Object -First 1
          node tools/windows/ci/soak.mjs "http://${ip}:3000" (Join-Path $app.FullName 'frontend') `
            --minutes $env:SOAK_MINUTES `
            --restart-cmd "powershell -NoProfile -ExecutionPolicy Bypass -File tools/windows/ci/kill-node.ps1" `
            --server-log (Join-Path $env:LOCALAPPDATA_TEST 'RefereeLights\logs\server.log') `
            --node-match 'RefereeLights\runtime' `
            --report soak-report.json
      # Pressão nas telas dos árbitros: latência, rajadas de cliques, várias
      # abas por juiz, F5 e queda de Wi-Fi (voto nunca pode sumir).
      - name: Pressão nas telas dos árbitros (4 min)
        shell: pwsh
        run: |
          $ip = (Get-NetIPAddress -AddressFamily IPv4 | Where-Object { $_.IPAddress -notlike '127.*' -and $_.IPAddress -notlike '169.254.*' } | Select-Object -First 1).IPAddress
          $app = Get-ChildItem -Directory (Join-Path $env:LOCALAPPDATA_TEST 'RefereeLights\app') | Select-Object -First 1
          node tools/windows/ci/stress-ref.mjs "http://${ip}:3000" (Join-Path $app.FullName 'frontend') --minutes 4

      - name: Relatório do soak
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soak-report
          path: soak-report.json
          retention-days: 14
      - name: Logs em caso de falha
        if: failure()
        shell: pwsh
        run: Get-ChildItem (Join-Path $env:LOCALAPPDATA_TEST 'RefereeLights\logs') | ForEach-Object { Write-Host "--- $($_.Name)"; Get-Content $_.FullName -Tail 80 }

  publish-teste:
    # Só manualmente, só release/*, só depois de TODOS os testes. Nunca versão.
    if: github.event_name == 'workflow_dispatch' && inputs.publish_teste && inputs.release_version == '' && startsWith(github.ref_name, 'release/')
    needs: [build, test, test-exe, test-update, soak]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/windows/launcher/go.mod
          cache-dependency-path: tools/windows/launcher/go.sum
      - uses: actions/download-artifact@v4
        with:
          name: referee-lights-windows
          path: dist
      - name: Manifesto do canal "teste", assinado
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          node tools/windows/make-manifest.mjs --url "https://github.com/${GITHUB_REPOSITORY}/releases/download/teste/RefereeLights.exe" \
            --notes-pt "Build de teste ${GITHUB_SHA::7}" --notes-en "Test build ${GITHUB_SHA::7}" --notes-es "Build de prueba ${GITHUB_SHA::7}"
          (cd tools/windows/launcher && go run ./cmd/signmanifest -sign ../../../dist/manifest-teste.json)
      - name: Atualizar pre-release rolante "teste"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete teste --yes --cleanup-tag -R "$GITHUB_REPOSITORY" 2>/dev/null || true
          # Duas formas juntas (R1): exe principal, zip como alternativa
          cd dist
          gh release create teste RefereeLights.exe referee-lights-windows.zip manifest-teste.json manifest-teste.json.sig -R "$GITHUB_REPOSITORY" \
            --prerelease --target "$GITHUB_SHA" --title "Build de teste" \
            --notes "Build ${GITHUB_SHA::7} de ${GITHUB_REF_NAME}, aprovado nos testes automáticos no Windows. Validação interna — não usar em competição."

  publish-release:
    # Versão estável (Latest): só manualmente, só release/*, só com TODOS os
    # testes verdes no MESMO artefato que vai ser publicado.
    if: github.event_name == 'workflow_dispatch' && inputs.release_version != '' && startsWith(github.ref_name, 'release/')
    needs: [build, test, test-exe, test-update, soak]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.release_version }}
      NOTES_PT: ${{ inputs.release_notes_pt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/windows/launcher/go.mod
          cache-dependency-path: tools/windows/launcher/go.sum
      - uses: actions/download-artifact@v4
        with:
          name: referee-lights-windows
          path: dist
      - name: Manifesto estável, assinado
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          test "$(node -p "require('./dist/build-info.json').channel")" = stable
          notes="${NOTES_PT:-Versão $VERSION}"
          node tools/windows/make-manifest.mjs --url "https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/RefereeLights.exe" \
            --notes-pt "$notes" --notes-en "Version $VERSION" --notes-es "Versión $VERSION"
          (cd tools/windows/launcher && go run ./cmd/signmanifest -sign ../../../dist/manifest-stable.json)
      - name: Release vX.Y.Z (Latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$VERSION" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::v$VERSION já existe: versão não se reaproveita"; exit 1
          fi
          cd dist
          gh release create "v$VERSION" RefereeLights.exe referee-lights-windows.zip manifest-stable.json manifest-stable.json.sig \
            -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest --title "Referee Lights $VERSION" \
            --notes "${NOTES_PT:-Referee Lights $VERSION}

          **RefereeLights.exe** — baixe e abra (sem instalar). Se o Windows avisar, clique em *Mais informações* → *Executar assim mesmo*.
          **referee-lights-windows.zip** — versão alternativa: extraia e abra o Iniciar.cmd."
