version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    # Majors só manualmente: Next 14→16 acidental quebrou produção (PRs #14
    # e #17), e a primeira varredura propôs TS 7, zod 4 e Tailwind 4 de uma
    # vez (PRs #22–#30). Vale para todas as dependências.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      frontend-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      server-minor-patch:
        update-types: ["minor", "patch"]
