openapi: 3.0.3
info:
  title: Referee Lights API
  version: 1.3.0
  description: |
    API HTTP do servidor Referee Lights. O tempo real (votos, cronômetro,
    estado da sala) usa Socket.IO — ver `docs/websocket-events.md`.

    Erros retornam `{ "error": "<código>" }`. Falhas de PIN contam por IP:
    30 falhas em 10 minutos bloqueiam novas tentativas com `429 too_many_attempts`.
servers:
  - url: http://localhost:3333
paths:
  /health:
    get:
      summary: Verificação de saúde
      responses:
        '200':
          description: Servidor no ar
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
  /rooms:
    post:
      summary: Cria uma sala
      description: Limite de 30 salas por IP a cada 10 minutos (loopback isento).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                locale: { $ref: '#/components/schemas/Locale' }
      responses:
        '201':
          description: Sala criada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoomAccess' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /rooms/{roomId}/access:
    post:
      summary: Recupera o acesso de uma sala existente (PIN admin)
      parameters:
        - $ref: '#/components/parameters/RoomId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminPinBody' }
      responses:
        '200':
          description: Dados de acesso da sala
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoomAccess' }
        '403': { $ref: '#/components/responses/InvalidPin' }
        '404': { $ref: '#/components/responses/RoomNotFound' }
        '429': { $ref: '#/components/responses/TooManyAttempts' }
  /rooms/{roomId}/refresh-ref-tokens:
    post:
      summary: Gera novos tokens (QR Codes) para os árbitros
      description: Os tokens anteriores deixam de valer.
      parameters:
        - $ref: '#/components/parameters/RoomId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminPinBody' }
      responses:
        '200':
          description: Dados de acesso com os novos tokens
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoomAccess' }
        '403': { $ref: '#/components/responses/InvalidPin' }
        '404': { $ref: '#/components/responses/RoomNotFound' }
        '429': { $ref: '#/components/responses/TooManyAttempts' }
  /key-relay/status:
    get:
      summary: Estado do Key Relay
      responses:
        '200':
          description: Estado atual
          content:
            application/json:
              schema:
                type: object
                properties:
                  available: { type: boolean, description: 'false quando KEY_RELAY_AVAILABLE não está ligado' }
                  active: { type: boolean }
                  roomId: { type: string, nullable: true, description: 'Sempre null (não é exposto)' }
                  keys: { $ref: '#/components/schemas/KeyPair' }
  /key-relay/start:
    post:
      summary: Ativa o Key Relay para uma sala
      description: |
        Ao revelar a decisão, o servidor envia `validKey` (2+ votos brancos) ou
        `invalidKey` (2+ vermelhos) para a janela em foco na máquina onde roda.
        Tecla aceita: F1–F12 ou uma letra/dígito, com até 3 modificadores
        `Ctrl`/`Shift`/`Alt`/`Meta` (ex.: `Ctrl+F2`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roomId, adminPin]
              properties:
                roomId: { type: string }
                adminPin: { type: string }
                validKey: { type: string, default: F1 }
                invalidKey: { type: string, default: F10 }
      responses:
        '200':
          description: Ativado
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  roomId: { type: string }
                  keys: { $ref: '#/components/schemas/KeyPair' }
        '400':
          description: '`missing_room_id` ou `invalid_key`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: '`invalid_pin` ou `key_relay_unavailable`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/RoomNotFound' }
        '429': { $ref: '#/components/responses/TooManyAttempts' }
  /key-relay/stop:
    post:
      summary: Desativa o Key Relay
      description: Exige o PIN da sala monitorada (ou de qualquer sala ativa, se ela já foi arquivada).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roomId, adminPin]
              properties:
                roomId: { type: string }
                adminPin: { type: string }
      responses:
        '200':
          description: Desativado
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
        '403':
          description: '`invalid_pin` ou `key_relay_unavailable`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/RoomNotFound' }
        '429': { $ref: '#/components/responses/TooManyAttempts' }
components:
  parameters:
    RoomId:
      name: roomId
      in: path
      required: true
      schema: { type: string, example: ABCD }
  schemas:
    Locale:
      type: string
      enum: [pt-BR, en-US, es-ES]
    AdminPinBody:
      type: object
      required: [adminPin]
      properties:
        adminPin: { type: string, example: '1234' }
    RoomAccess:
      type: object
      properties:
        roomId: { type: string, description: 'Código de 4 letras' }
        adminPin: { type: string, description: 'PIN de 4 dígitos' }
        joinQRCodes:
          type: object
          properties:
            left: { $ref: '#/components/schemas/RefToken' }
            center: { $ref: '#/components/schemas/RefToken' }
            right: { $ref: '#/components/schemas/RefToken' }
    RefToken:
      type: object
      properties:
        token: { type: string }
    KeyPair:
      type: object
      properties:
        valid: { type: string, example: F1 }
        invalid: { type: string, example: F10 }
    Error:
      type: object
      properties:
        error: { type: string }
  responses:
    InvalidPin:
      description: '`invalid_pin`'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RoomNotFound:
      description: '`room_not_found`'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooManyAttempts:
      description: '`too_many_attempts` — muitas falhas de PIN deste IP'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: '`rate_limited`'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
